# Builds Asqu for each supported computer, signs the builds and publishes them: a GitHub
# release, asqu.dev (the iDevEngineer/asqu-site repo) and the Homebrew formula.
# Runs when a version tag like v0.1.0 is pushed.
#
# Safety: testing and building run code from every dependency, so those jobs can only
# read the repository and hand their builds on as artifacts. Only the `release` job can
# write, and it runs no dependency code at all: it signs with the system's openssl, and
# the release key exists only inside the one signing step.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Tests aren't run twice: a release only goes out if the full test run (ci.yml) passed
  # on this exact commit. Builds start meanwhile; publishing waits for both.
  tests-passed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for this commit's test run, and require it passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')"
            echo "tests: ${run:-not started}"
            case "$run" in
              "completed success") exit 0 ;;
              completed*) echo "The tests didn't pass on this commit, so nothing is released."; exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for the tests."; exit 1

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      # No build cache here: what gets signed and shipped is always built from scratch.
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        working-directory: target/${{ matrix.target }}/release
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="asqu-${{ matrix.target }}.zip"
            cp "$GITHUB_WORKSPACE/LICENSE" LICENSE.txt
            7z a -tzip "$GITHUB_WORKSPACE/out/$asset" asqu.exe LICENSE.txt >/dev/null
            (cd "$GITHUB_WORKSPACE/out" && sha256sum "$asset" > "$asset.sha256")
          else
            asset="asqu-${{ matrix.target }}.tar.gz"
            cp "$GITHUB_WORKSPACE/LICENSE" LICENSE
            tar -czf "$GITHUB_WORKSPACE/out/$asset" asqu LICENSE
            (cd "$GITHUB_WORKSPACE/out" && shasum -a 256 "$asset" > "$asset.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  # Signs and publishes. No cargo, no dependency code: only shell, openssl and gh.
  release:
    needs: [tests-passed, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dl
          merge-multiple: true
      - name: Check the builds arrived intact
        working-directory: dl
        run: sha256sum -c ./*.sha256
      # The only step that sees the release key. Ed25519 signatures from openssl are the
      # same as Asqu's own (both follow RFC 8032), and the updater checks them.
      - name: Sign the builds
        working-directory: dl
        env:
          ASQU_RELEASE_KEY: ${{ secrets.ASQU_RELEASE_KEY }}
        run: |
          umask 077
          key="$(mktemp -d)"
          trap 'rm -rf "$key"' EXIT
          # PKCS#8 wrapper for a raw 32-byte Ed25519 private key.
          printf '%s%s' 302e020100300506032b657004220420 "$ASQU_RELEASE_KEY" | xxd -r -p > "$key/key.der"
          openssl pkey -inform DER -in "$key/key.der" -out "$key/key.pem"
          for f in asqu-*.tar.gz asqu-*.zip; do
            [ -f "$f" ] || continue
            openssl pkeyutl -sign -rawin -inkey "$key/key.pem" -in "$f" -out "$key/sig.bin"
            xxd -p -c 256 "$key/sig.bin" | tr -d '\n' > "$f.sig"
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Asqu $tag" --notes "Install: curl -fsSL https://asqu.dev/install | sh  (Windows: irm https://asqu.dev/install.ps1 | iex)"
          gh release upload "$tag" dl/* --clobber

  # Puts the release on the website, which has its own repo (iDevEngineer/asqu-site).
  # A job of its own: it runs that repo's publish script, so it gets nothing but read
  # access here and the one key that can write there. It never sees the release key.
  update-website:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: asqu
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: iDevEngineer/asqu-site
          ssh-key: ${{ secrets.ASQU_SITE_KEY }}
          path: asqu-site
      - name: Fetch the signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dl
          (cd dl && sha256sum -c ./*.sha256)
      # Dokploy builds asqu.dev from that repo's main branch.
      - name: Put the release on the website
        run: |
          sh asqu-site/publish.sh dl "$GITHUB_REF_NAME" asqu
          cd asqu-site
          git config user.name asqu-release
          git config user.email asqu-release@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Asqu ${GITHUB_REF_NAME}"
          git push
      - name: Redeploy asqu.dev
        env:
          HOOK: ${{ secrets.ASQU_SITE_DEPLOY_HOOK }}
        run: |
          [ -n "$HOOK" ] || { echo "No deploy hook set; skipping."; exit 0; }
          # Dokploy's hook checks which branch changed.
          # Retries ride out a brief network problem between GitHub and the server.
          curl -fsS --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 20 \
            -X POST -H "Content-Type: application/json" -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/main"}' "$HOOK" >/dev/null

  # Points the Homebrew formula (iDevEngineer/homebrew-asqu) at the new release, once
  # asqu.dev is serving it.
  update-homebrew:
    needs: update-website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: asqu
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: iDevEngineer/homebrew-asqu
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          path: tap
      - name: Write the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir fp
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir fp --pattern 'asqu-*.tar.gz.sha256'
          mkdir -p tap/Formula
          sh asqu/scripts/brew-formula.sh "$GITHUB_REF_NAME" fp > tap/Formula/asqu.rb
      - name: Publish it
        working-directory: tap
        run: |
          git config user.name asqu-release
          git config user.email asqu-release@users.noreply.github.com
          git add Formula/asqu.rb
          git diff --cached --quiet && exit 0
          git commit -m "asqu ${GITHUB_REF_NAME#v}"
          git push
