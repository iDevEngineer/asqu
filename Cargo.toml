[package]
name = "asqu"
version = "0.2.1"
edition = "2021"
description = "Version control that nobody has to manage."
license = "FSL-1.1-ALv2"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "asqu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1.5"
cap-std = "4.0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
diffy = "0.4"
ed25519-dalek = "2"
getrandom = "0.2"
globset = "0.4"
ignore = "0.4"
notify-debouncer-mini = "0.4"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
rusty-s3 = "0.10.2"
serde_json = "1"
similar = "2"
tiny_http = "0.12"
toml = "0.8"
url = "2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Leave out internal names and labels: smaller downloads, and harder to take apart.
strip = true

# zstd is C code: build it fast even in test builds, or every history read crawls.
[profile.dev.package.zstd-sys]
opt-level = 3
